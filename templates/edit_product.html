<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
</head>

<body>

    <h1>Edit Product</h1>

    <form method="POST">

        <input type="text"
               name="name"
               value="{{ product['name'] }}">

        <input type="number"
               name="price"
               value="{{ product['price'] }}">

        <textarea name="description">{{ product['description'] }}</textarea>

        <input type="text"
               name="image"
               value="{{ product['image'] }}">

        <button type="submit">
            Update Product
        </button>

    </form>

</body>
</html>
