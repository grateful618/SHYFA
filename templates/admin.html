<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

/* HEADER */

.header{
    background:#14532d;
    color:white;

    padding:25px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
}

/* ADD BUTTON */

.add-btn{
    background:#84cc16;
    color:black;

    padding:12px 20px;

    border-radius:30px;

    text-decoration:none;

    font-weight:bold;
}

/* PRODUCTS */

.products{
    padding:40px 8%;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:25px;
}

/* CARD */

.card{
    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

/* IMAGE */

.card img{
    width:100%;
    height:240px;

    object-fit:cover;
}

/* CONTENT */

.card-content{
    padding:20px;
}

.card-content h2{
    margin-top:0;
}

.price{
    color:#4d7c0f;

    font-size:22px;

    font-weight:bold;
}

/* ACTIONS */

.actions{
    display:flex;
    gap:12px;

    margin-top:20px;
}

/* BUTTONS */

.edit-btn,
.delete-btn{

    flex:1;

    text-align:center;

    padding:12px;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;
}

.edit-btn{
    background:#2563eb;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

/* MOBILE */

@media(max-width:768px){

    .header{
        flex-direction:column;
        gap:20px;
        text-align:center;
    }

}

</style>

</head>

<body>

<div class="header">

    <h1>
        Admin Dashboard
    </h1>

    <a href="/add-product"
    class="add-btn">

        + Add Product

    </a>

</div>

<section class="products">

    {% for product in products %}

    <div class="card">

        <img src="{{ url_for(
            'static',
            filename='images/' + product['image']
        ) }}">

        <div class="card-content">

            <h2>
                {{ product['name'] }}
            </h2>

            <p class="price">
                ₦{{ product['price'] }}
            </p>

            <p>
                {{ product['description'] }}
            </p>

            <div class="actions">

                <a href="/edit-product/{{ product['id'] }}"
                class="edit-btn">

                    Edit

                </a>

                <a href="/delete-product/{{ product['id'] }}"
                class="delete-btn">

                    Delete

                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</section>

</body>
</html>
