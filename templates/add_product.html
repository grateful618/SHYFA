<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
        }

        .form-container{
            width:400px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
        }

        input, textarea{
            width:100%;
            padding:12px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#14532d;
            color:white;
            border:none;
        }

    </style>

</head>

<body>

    <div class="form-container">

        <h1>Add Product</h1>

        <form method="POST">

            <input type="text" name="name" placeholder="Product Name" required>

            <input type="number" name="price" placeholder="Price" required>

            <textarea name="description" placeholder="Description"></textarea>

            <input type="text" name="image" placeholder="image.jpg" required>

            <button type="submit">
                Add Product
            </button>

        </form>

    </div>

</body>
</html>
